<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>De wiskunde van Mehdi</title><style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#2563eb;color:white;text-align:center;padding:22px}main{max-width:800px;margin:auto;padding:15px 15px 80px}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #0001}button{border:0;border-radius:12px;padding:13px;margin:5px;font-weight:bold;font-size:16px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{min-height:70px;background:#eef4ff}.primary{background:#2563eb;color:white}.good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.choice{width:calc(50% - 14px);background:#eef2f7}.step{padding:15px;border-left:6px solid #2563eb;background:#f8fbff;border-radius:12px;margin:10px 0}.example{padding:15px;background:#eef4ff;border-radius:12px;font-size:18px}input{width:100%;padding:14px;box-sizing:border-box;font-size:20px;border:2px solid #ccd5e1;border-radius:12px}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;text-align:center;padding:8px}.feedback{padding:12px;border-radius:12px;font-weight:bold}.small{color:#667085}</style></head><body>
<header><h1>🧠 De wiskunde van Mehdi</h1><p>Stap voor stap leren rekenen</p><b>⭐ XP: <span id="xp">0</span> · Niveau <span id="level">1</span></b></header>
<main>
<section id="home"><div class="card"><h2>Welkom Mehdi! 👋</h2><p>Bij elk vraagstuk werk je in <b>4 stappen</b>.</p><div class="grid"><button class="big" onclick="learn('Optellen','Bij optellen doe je aantallen bij elkaar. Voorbeeld: 240 + 130 = 370.')">➕ Optellen</button><button class="big" onclick="learn('Aftrekken','Bij aftrekken haal je iets weg of zoek je het verschil. Voorbeeld: 500 − 180 = 320.')">➖ Aftrekken</button><button class="big" onclick="learn('Vermenigvuldigen','Bij vermenigvuldigen herhaal je dezelfde hoeveelheid. Voorbeeld: 4 × 25 = 100.')">✖️ Vermenigvuldigen</button><button class="big" onclick="learn('Delen','Bij delen verdeel je iets eerlijk. Voorbeeld: 24 : 6 = 4.')">➗ Delen</button></div><button class="primary" onclick="practice()">📝 Oefeningen</button><button onclick="problem()">🧠 Vraagstukken</button></div></section>
<section id="learn" class="hidden"><div class="card"><button onclick="home()">← Terug</button><h2 id="lt"></h2><div class="example" id="lx"></div><p>Lees rustig, zoek de getallen en controleer je antwoord.</p><button class="primary" onclick="practice()">Oefenen →</button></div></section>
<section id="practice" class="hidden"><div class="card"><button onclick="home()">← Stoppen</button><h2>📝 Oefening</h2><p id="pq"></p><input id="pa" type="number" placeholder="Jouw antwoord"><button class="primary" onclick="pc()">Nakijken</button><div id="pf"></div><button id="pn" class="good hidden" onclick="practice()">Volgende →</button></div></section>
<section id="problem" class="hidden"><div class="card"><button onclick="home()">← Stoppen</button><h2>🧠 Vraagstuk</h2><div class="example" id="pt"></div><p><b>Stap <span id="sn">1</span> van 4</b></p><div id="sa"></div><div id="sf"></div></div></section>
</main><nav><button onclick="home()">🏠 Start</button><button onclick="practice()">📝 Oefenen</button><button onclick="problem()">🧠 Vraagstukken</button></nav>
<script>
let xp=+localStorage.mehdiXP||0,qi=0,pi=0,st=1;const q=[[2380,'−',3110,5490],[1650,'−',770,2420],[8,'×',200,25],[96,':',12,8],[1275,'+',2100,825]];
const p=[{t:'De speelgoedwinkel bestelt eerst voor €2.380 aan speelgoed. De twee bestellingen kosten samen €5.490. Hoeveel kost de tweede bestelling?',n1:2380,n2:5490,op:'−',a:3110,s:'De tweede bestelling kost €3.110.',c:'2.380 + 3.110 = 5.490'},{t:'Op school zijn er eerst 1.650 kleurpotloden. Daarna zijn er 2.420. Hoeveel zijn erbij gekomen?',n1:1650,n2:2420,op:'−',a:770,s:'Er zijn 770 kleurpotloden bijgekomen.',c:'1.650 + 770 = 2.420'},{t:'Er zijn 8 dozen met telkens 25 schriften. Hoeveel schriften zijn er?',n1:8,n2:25,op:'×',a:200,s:'Er zijn 200 schriften.',c:'8 × 25 = 200'},{t:'Mehdi heeft 96 snoepjes en verdeelt ze over 8 kinderen. Hoeveel krijgt elk kind?',n1:96,n2:8,op:':',a:12,s:'Elk kind krijgt 12 snoepjes.',c:'12 × 8 = 96'}];
function upd(){document.querySelector('#xp').textContent=xp;document.querySelector('#level').textContent=Math.floor(xp/100)+1;localStorage.mehdiXP=xp}function add(){xp+=10;upd()}upd();
function hide(){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'))}function home(){hide();home.id='home';document.querySelector('#home').classList.remove('hidden')}function learn(a,b){hide();document.querySelector('#learn').classList.remove('hidden');lt.textContent=a;lx.textContent=b}
function practice(){hide();document.querySelector('#practice').classList.remove('hidden');let x=q[qi++%q.length];pq.textContent=x[0]+' '+x[1]+' '+x[3]+' = ?';pa.value='';pf.innerHTML='';pn.classList.add('hidden');window.ans=x[2]}function pc(){if(+pa.value===ans){add();pf.innerHTML='<div class="feedback good">✅ Goed gedaan!</div>';pn.classList.remove('hidden')}else pf.innerHTML='<div class="feedback bad">❌ Probeer opnieuw.</div>'}
function problem(){hide();document.querySelector('#problem').classList.remove('hidden');pi%=p.length;st=1;render()}
function render(){let x=p[pi],a=document.querySelector('#sa');pt.textContent=x.t;sn.textContent=st;sf.innerHTML='';if(st===1)a.innerHTML='<div class="step"><h3>1. Voor</h3><p>Welke getallen zijn belangrijk?</p><button class="choice" onclick="num('+x.n1+')">'+x.n1.toLocaleString('nl-BE')+'</button><button class="choice" onclick="num('+x.n2+')">'+x.n2.toLocaleString('nl-BE')+'</button></div>';if(st===2)a.innerHTML='<div class="step"><h3>2. Bewerking</h3><p>Welke bewerking gebruik je?</p>'+['+','−','×',':'].map(o=>'<button class="choice" onclick="op(&quot;'+o+'&quot;)">'+o+'</button>').join('')+'</div>';if(st===3)a.innerHTML='<div class="step"><h3>3. Antwoordzin</h3><p>Kies de juiste antwoordzin.</p><button class="choice" onclick="sent(1)">'+x.s+'</button><button class="choice" onclick="sent(0)">Het antwoord is '+x.a+'.</button></div>';if(st===4)a.innerHTML='<div class="step"><h3>4. Controleren</h3><p>Welke controle klopt?</p><button class="choice" onclick="check(1)">✅ '+x.c+'</button><button class="choice" onclick="check(0)">❌ Ik heb niet gecontroleerd.</button></div>'}
function ok(m){add();sf.innerHTML='<div class="feedback good">✅ '+m+'</div>';setTimeout(()=>{st++;if(st<=4)render();else{sa.innerHTML='<div class="step"><h2>🎉 Vraagstuk klaar!</h2><p>Je hebt alle 4 stappen goed gedaan.</p><button class="good" onclick="pi++;problem()">Volgend vraagstuk →</button></div>';sf.innerHTML=''}},450)}
function no(m){sf.innerHTML='<div class="feedback bad">❌ '+m+' Probeer opnieuw.</div>'}function num(n){let x=p[pi];n===x.n1||n===x.n2?ok('Goed!'):no('Kies un getal important.')}function op(o){o===p[pi].op?ok('Juiste bewerking!'):no('Kijk goed naar de vraag.')}function sent(v){v?ok('Goede antwoordzin!'):no('Kies de volledige antwoordzin.')}function check(v){v?ok('Goed gecontroleerd!'):no('Controleer je berekening.')}
</script></body></html>
